name: Nischen Explorer

on:
  push:
    branches:
      - main

  workflow_run:
    workflows:
      - Initial ZIP Import
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nischen-explorer

jobs:
  build:
    # workflow_run must only build after a successful import.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # For workflow_run, build exactly the commit produced by import.yml.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Projektstruktur prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f app.py
          test -f requirements.txt
          test -f Dockerfile

          echo "=== Projektstruktur ==="
          find . -maxdepth 3 -type f             -not -path './.git/*'             -not -path './.github/*'             -not -path './__pycache__/*'             -not -path './.pytest_cache/*'             -print | sort

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Dependencies installieren
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python Syntax prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q .

      - name: Tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f tests_smoke.py ]; then
            echo "Führe tests_smoke.py aus..."
            python tests_smoke.py

          elif [ -d tests ]; then
            echo "Führe pytest aus..."
            python -m pytest -q

          else
            echo "::warning::Keine Tests gefunden."
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment-Artefakt anzeigen
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " NISCHEN EXPLORER BUILD ERFOLGREICH"
          echo "=========================================="
          echo
          echo "Container:"
          echo "${{ env.IMAGE_NAME }}:latest"
          echo
          echo "Commit:"
          echo "${{ github.sha }}"
