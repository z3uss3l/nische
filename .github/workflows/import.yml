name: Initial ZIP Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ZIP finden und prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="nischen-explorer-initial-v4_1.zip"

          test -f "$ZIP"
          unzip -t "$ZIP"

          echo "ZIP gefunden und gültig:"
          ls -lh "$ZIP"

      - name: ZIP temporär entpacken
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="nischen-explorer-initial-v4_1.zip"
          TMP=".initial-import"

          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          echo "Entpackter Inhalt:"
          find "$TMP" -type f -print | sort

      - name: Projektroot bestimmen
        shell: bash
        run: |
          set -Eeuo pipefail

          TMP=".initial-import"

          mapfile -t APPS < <(
            find "$TMP"               -type f               -name "app.py"               -not -path '*/__pycache__/*'
          )

          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "::error::Es wurde nicht exakt eine app.py gefunden."
            printf '%s\n' "${APPS[@]}"
            exit 1
          fi

          APP="${APPS[0]}"
          ROOT="$(dirname "$APP")"

          echo "Erkannter Projektroot: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Projektdateien übernehmen
        shell: bash
        run: |
          set -Eeuo pipefail

          # Der ZIP-Inhalt wird in den tatsächlichen Repository-Root importiert.
          # Bestehende GitHub-Metadaten und Workflows bleiben unangetastet.
          cp -a "$ROOT"/. .

          rm -rf .initial-import

      - name: Import prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f app.py
          test -f requirements.txt
          test -f Dockerfile

          echo "=== Repository nach Import ==="
          find . -maxdepth 3 -type f             -not -path './.git/*'             -not -path './.github/*'             -not -path './__pycache__/*'             -not -path './.pytest_cache/*'             -print | sort

      - name: Änderungen committen und pushen
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "chore: import initial nischen explorer"
          git push origin HEAD:${GITHUB_REF_NAME}
