name: Nischen Explorer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_DIR: nische
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nischen-explorer

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Projektstruktur prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository:"
          find . -maxdepth 2 -type f | sort

          test -f "$APP_DIR/app.py"
          test -f "$APP_DIR/requirements.txt"
          test -f "$APP_DIR/Dockerfile"

          echo "Projekt gefunden:"
          ls -la "$APP_DIR"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nische/requirements.txt

      - name: Python Dependencies installieren
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python Syntax prüfen
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m compileall -q .

      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f tests_smoke.py ]; then
            python tests_smoke.py
          elif [ -d tests ]; then
            python -m pytest -q
          else
            echo "::warning::Keine Tests gefunden."
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./nische
          file: ./nische/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build erfolgreich
        run: |
          echo "=========================================="
          echo " Nischen Explorer gebaut..."
          echo "=========================================="
          echo
          echo "Image:"
          echo "${{ env.IMAGE_NAME }}:latest"
          echo
          echo "SHA:"
          echo "${{ github.sha }}"
