name: Nischen Explorer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ZIP_FILE: nischen-explorer-initial-v4_1.zip
  BUILD_DIR: .build
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nischen-explorer

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP prüfen und Projekt extrahieren
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== Repository ==="
          find . -maxdepth 2 -type f \
            -not -path './.git/*' \
            -print | sort

          echo
          echo "=== ZIP prüfen ==="

          test -f "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo
          echo "=== ZIP-Inhalt ==="
          unzip -l "$ZIP_FILE"

          echo
          echo "=== Extrahieren ==="

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q "$ZIP_FILE" -d "$BUILD_DIR"

          echo
          echo "=== Extrahierter Inhalt ==="

          find "$BUILD_DIR" -maxdepth 4 -type f \
            -not -path '*/__pycache__/*' \
            -not -path '*/.pytest_cache/*' \
            -print | sort

      - name: Projektroot erkennen
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Suche app.py..."

          mapfile -t APP_FILES < <(
            find "$BUILD_DIR" \
              -type f \
              -name "app.py" \
              -not -path '*/__pycache__/*'
          )

          if [ "${#APP_FILES[@]}" -ne 1 ]; then
            echo "::error::Es wurde nicht exakt eine app.py gefunden."
            printf '%s\n' "${APP_FILES[@]}"
            exit 1
          fi

          APP_FILE="${APP_FILES[0]}"
          APP_DIR="$(dirname "$APP_FILE")"

          echo "app.py: $APP_FILE"
          echo "Projektroot: $APP_DIR"

          test -f "$APP_DIR/requirements.txt" || {
            echo "::error::requirements.txt fehlt."
            exit 1
          }

          test -f "$APP_DIR/Dockerfile" || {
            echo "::error::Dockerfile fehlt."
            exit 1
          }

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo
          echo "=== Projektstruktur ==="

          find "$APP_DIR" -maxdepth 3 -type f \
            -not -path '*/__pycache__/*' \
            -not -path '*/.pytest_cache/*' \
            -print | sort

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Dependencies installieren
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python Syntax prüfen
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m compileall -q .

      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f tests_smoke.py ]; then
            echo "Führe tests_smoke.py aus..."
            python tests_smoke.py

          elif [ -d tests ]; then
            echo "Führe pytest aus..."
            python -m pytest -q

          else
            echo "::warning::Keine Tests gefunden."
          fi

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          file: ./${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment-Artefakt anzeigen
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " NISCHEN EXPLORER BUILD ERFOLGREICH"
          echo "=========================================="
          echo
          echo "Container:"
          echo "${{ env.IMAGE_NAME }}:latest"
          echo
          echo "Commit:"
          echo "${{ github.sha }}"
          echo
          echo "Projektroot:"
          echo "${{ env.APP_DIR }}"
