name: Nischen Explorer – Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_DIR: app
  ZIP_FILE: nischen-explorer-initial-v4_1.zip
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nischen-explorer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository:"
          pwd
          find . -maxdepth 2 -type f -print | sort

          test -f "$ZIP_FILE"

          echo "ZIP gefunden:"
          ls -lh "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

      - name: Projekt aus ZIP extrahieren
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR"

          unzip -q "$ZIP_FILE" -d "$APP_DIR"

          echo "Extrahierter Projektbaum:"
          find "$APP_DIR" -maxdepth 3 -type f \
            ! -path '*/__pycache__/*' \
            ! -path '*/.pytest_cache/*' \
            -print | sort

      - name: Extraktionsstruktur erkennen
        shell: bash
        run: |
          set -Eeuo pipefail

          # Falls das ZIP einen einzigen Top-Level-Ordner enthält,
          # wird dieser als tatsächliches Projektverzeichnis verwendet.
          shopt -s nullglob dotglob

          entries=("$APP_DIR"/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            INNER_DIR="${entries[0]}"

            echo "ZIP enthält einen Top-Level-Projektordner:"
            echo "$INNER_DIR"

            find "$INNER_DIR" -maxdepth 2 -type f -print | sort

            # Inhalt nach APP_DIR verschieben
            tmp_dir="${APP_DIR}.tmp"
            mkdir "$tmp_dir"

            cp -a "$INNER_DIR"/. "$tmp_dir"/

            rm -rf "$APP_DIR"
            mv "$tmp_dir" "$APP_DIR"
          fi

          echo "Finales Projektverzeichnis:"
          find "$APP_DIR" -maxdepth 3 -type f \
            ! -path '*/__pycache__/*' \
            ! -path '*/.pytest_cache/*' \
            -print | sort

          test -f "$APP_DIR/app.py" || {
            echo "::error::app.py wurde nach dem Entpacken nicht gefunden."
            exit 1
          }

      - name: Python-Version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Python-Abhängigkeiten installieren
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Python-Syntax prüfen
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m compileall -q .

      - name: Tests ausführen
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "Keine tests/ gefunden – Syntaxprüfung wurde durchgeführt."
          fi

      - name: Docker Build vorbereiten
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$APP_DIR/Dockerfile"

          echo "Dockerfile:"
          sed -n '1,240p' "$APP_DIR/Dockerfile"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx konfigurieren
        uses: docker/setup-buildx-action@v3

      - name: Docker Image bauen und zu GHCR pushen
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nischen-explorer:latest
            ghcr.io/${{ github.repository_owner }}/nischen-explorer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment erfolgreich
        shell: bash
        run: |
          echo "========================================"
          echo "Nischen Explorer erfolgreich gebaut."
          echo "========================================"
          echo
          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/nischen-explorer:latest"
          echo
          echo "Commit:"
          echo "${{ github.sha }}"
